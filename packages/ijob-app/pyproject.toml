[project]
name = "ijob-app"
version = "0.1.0"
description = "ijob command-line and terminal interface."
readme = "README.md"
authors = [
    { name = "rstlix0x0" }
]
requires-python = ">=3.14.10"
license = "Apache-2.0"
dependencies = [
    "typer>=0.27.3,<0.28",
    "ijob-ai",
    "ijob-core",
    "ijob-sources",
    "dspy>=3.4.1,<3.5",
    "pypdf>=6.21.4,<7",
    "requests>=2.34.2,<3",
    "textual>=8.2.8,<8.3",
]

[project.scripts]
ijob = "ijob_app.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
