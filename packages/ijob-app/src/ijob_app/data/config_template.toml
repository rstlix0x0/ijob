# ijob config. Every setting below is commented out, so ijob uses its built-in
# defaults. Remove the leading "# " from a setting to change it; a key you set
# replaces the built-in value for that key alone.

# [filters]
# countries = ["SG"]          # country codes or names
# remote = ["worldwide"]      # none, country, region or worldwide
# since = "7d"                # <n>d or <n>h
# companies = ["Acme"]        # case-insensitive substrings
# require_salary = false      # drop postings that state no salary

# Keep postings paying at least this much.
# [filters.min_salary]
# amount = 6000
# currency = "SGD"
# period = "month"            # hour, month or year

# Role patterns are regular expressions, matched case-insensitively. Single
# quotes keep each backslash as written.
# [filters.role]
# include = ['\bproduct manager', '\bproject manager']
# exclude = ['\bintern\b', '\bjunior\b']

# Each model is written <provider>/<model>. A task needs its model set before it
# runs.
# [models]
# cv_profile   = "claude-sdk/claude-sonnet-5-5"
# instructions = "claude-sdk/claude-haiku-5-5"
# judge        = "claude-sdk/claude-haiku-5-5"
# scorer       = "claude-sdk/claude-haiku-5-5"
# source_recipe = "claude-sdk/claude-sonnet-5-5"
# job_extract  = "claude-sdk/claude-haiku-5-5"
# source_agent  = "claude-sdk/claude-sonnet-5-5"
# explore_agent = "claude-sdk/claude-sonnet-5-5"
# eval_grader   = "openrouter/openai/gpt-6.1-sol"
# tuner         = "claude-sdk/claude-opus-5-5"   # must be claude-sdk: its prompts carry your data

# Limits on model calls.
# [llm]
# max_cost_usd = 0.50         # above 0 and at most 100
# concurrency  = 4            # 1 to 16
# timeout_s    = 120          # 10 to 600

# Without cli_path, ijob looks for claude on the PATH.
# [providers.claude-sdk]
# cli_path = "/usr/local/bin/claude"

# The trace store is traces.db in the ijob home.
# [tracing]
# max_size_mb = 256           # 16 to 10240

# The local Phoenix instance. Its endpoint must be on this machine (localhost,
# 127.0.0.1 or ::1).
# [phoenix]
# endpoint = "http://127.0.0.1:6006"

# The eval commands. The jury holds 2 to 5 different models and must stay on one
# line. Only OpenRouter spend counts toward the two caps.
# [eval]
# jury = ["claude-sdk/claude-opus-5-5", "openrouter/openai/gpt-6.1-sol", "openrouter/google/gemini-4-argon"]
# max_cost_usd   = 4          # per command; above 0 and at most 100
# total_cost_usd = 10         # across all commands; above 0 and at most 100

# The tuning commands. Candidates and models are written on one line each; a
# model listed twice counts once.
# [tune]
# candidates = ["openrouter/z-ai/glm-5.3-flash", "openrouter/openai/gpt-5-nano", "openrouter/deepseek/deepseek-v4.1-flash", "openrouter/qwen/qwen3.8-flash", "openrouter/mistralai/mistral-small-2603", "openrouter/openai/gpt-5.4-nano"]
# baseline = "claude-sdk/claude-sonnet-5-5"
# models = []                 # set after reading the tuning report
# max_cost_usd = 2            # per tuning run; above 0 and at most 100
