[project]
name = "ijob-ai"
version = "0.1.0"
description = "ijob LLM providers, DSPy modules, agents and tuning."
readme = "README.md"
authors = [
    { name = "rstlix0x0" }
]
requires-python = ">=3.14.10"
license = "Apache-2.0"
dependencies = [
    "ijob-core",
    "dspy>=3.4.1,<3.5",
    "claude-agent-sdk>=0.2.176,<0.3",
    "pypdf>=6.21.4,<7",
    "pydantic>=2.14.2,<3",
    "opentelemetry-sdk>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "requests>=2.34.2,<3",
    "deepeval>=4.3.2,<5",
    "optuna>=5,<6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
