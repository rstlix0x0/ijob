[dependency-groups]
dev = ["mypy==2.4.1", "pytest==9.2.0", "ruff==0.17.3"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
ijob-core = { workspace = true }
ijob-sources = { workspace = true }

[tool.ruff.lint]
extend-select = [
  "E", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "D", "PT", "S", "TRY", "PL", "N", "C4",
  "PTH", "RET", "ARG", "ERA", "PGH", "T20", "BLE", "A", "DTZ", "PERF", "FURB", "PIE", "FBT",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"packages/*/tests/**" = ["S101", "PLR2004", "D"]

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["explicit-override"]

[tool.pytest]
minversion = "9.0"
strict = true
filterwarnings = ["error"]
addopts = ["--import-mode=importlib", "--doctest-modules"]
testpaths = ["packages"]
